<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>INSECT ARENA</title><style>*{box-sizing:border-box}body{margin:0;background:#101c15;color:#f5efcf;font:16px system-ui;text-align:center}header{padding:12px;background:#203927}h1{font-size:23px;margin:5px}button,select{font:inherit;padding:10px;border:0;border-radius:12px;background:#d5b96a;color:#162519;margin:4px;touch-action:none}canvas{width:100%;max-width:900px;aspect-ratio:16/10;display:block;margin:auto;background:#263f2c;touch-action:none}.controls{display:flex;justify-content:space-around;max-width:900px;margin:auto}.controls button{min-width:65px;min-height:62px}#status{min-height:25px}small{color:#c6c6ad}</style><header><h1>INSECT ARENA · 0.1</h1><label>Vechter <select id="fighter"><option value="0">Mier · snelle steek</option><option value="1">Bidsprinkhaan · klauwslag</option><option value="2">Neushoornkever · stormram</option><option value="3">Schorpioen · gifsteek</option></select></label><button id="start">Start gevecht</button><button id="pause">Pauze</button><div id="status">Kies je vechter en start.</div></header><canvas id="game" width="900" height="560"></canvas><div class="controls"><div><button data-key="left">◀</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div><button data-key="hit">AANVAL</button><button data-key="special">SPECIAL</button></div></div><small>Toetsen: WASD/pijlen bewegen · spatie aanval · Shift special. Voortgang wordt lokaal bewaard.</small><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),status=document.querySelector('#status'),keys={},types=[{name:'Mier',color:'#392b21',hp:90,speed:3.9,damage:10,range:64},{name:'Bidsprinkhaan',color:'#72aa4e',hp:105,speed:3.2,damage:16,range:88},{name:'Neushoornkever',color:'#663e27',hp:145,speed:2.5,damage:21,range:65},{name:'Schorpioen',color:'#a17b40',hp:115,speed:3,damage:13,range:98}];let player,enemy,playing=false,paused=false,particles=[],wins=Number((()=>{try{return localStorage.getItem('iaWins')}catch(e){return 0}})()||0),last=0;function unit(id,x,y){let t=types[id];return{id,x,y,hp:t.hp,max:t.hp,face:1,cool:0,special:0,flash:0}}function reset(){player=unit(+document.querySelector('#fighter').value,190,300);enemy=unit((player.id+1+Math.floor(Math.random()*3))%4,710,300);playing=true;paused=false;particles=[];status.textContent='Overwin de tegenstander! · Overwinningen: '+wins}function attack(a,b,special=false){if(!playing||paused||a.cool>0||special&&a.special>0)return;let t=types[a.id],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);a.face=dx>=0?1:-1;a.cool=special?52:24;if(special)a.special=220;if(dist<t.range+(special?45:0)){b.hp=Math.max(0,b.hp-t.damage*(special?2.2:1));b.flash=12;b.x=Math.max(55,Math.min(845,b.x+Math.sign(dx)*24));for(let i=0;i<14;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:25,color:special?'#f8d657':'#e6e3a0'});if(b.hp<=0){playing=false;if(b===enemy){wins++;try{localStorage.setItem('iaWins',wins)}catch(e){};status.textContent='GEWONNEN! Totaal: '+wins+' · Start opnieuw.'}else status.textContent='VERLOREN! Probeer opnieuw.'}}}function drawUnit(a){let t=types[a.id];g.save();g.translate(a.x,a.y);g.scale(a.face,1);g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,24,43,11,0,0,7);g.fill();g.strokeStyle='#1c1b12';g.lineWidth=5;for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(-16,i*10);g.lineTo(-39,i*17+24);g.moveTo(16,i*10);g.lineTo(39,i*17+24);g.stroke()}g.fillStyle=a.flash?'#fff2aa':t.color;g.beginPath();g.ellipse(0,0,a.id===2?38:29,22,0,0,7);g.fill();g.beginPath();g.arc(29,-5,15,0,7);g.fill();g.strokeStyle=t.color;g.lineWidth=5;g.beginPath();if(a.id===1){g.moveTo(25,4);g.lineTo(49,-36);g.lineTo(68,-20)}else if(a.id===3){g.moveTo(-24,0);g.quadraticCurveTo(-70,-65,-20,-85)}else if(a.id===2){g.moveTo(33,-13);g.lineTo(56,-42)}else{g.moveTo(33,-14);g.lineTo(55,-30)}g.stroke();g.restore();g.fillStyle='#1a1a1a';g.fillRect(a.x-49,a.y-66,98,11);g.fillStyle=a===player?'#75e68b':'#e66b61';g.fillRect(a.x-47,a.y-64,94*a.hp/a.max,7);g.fillStyle='#fff';g.font='15px system-ui';g.textAlign='center';g.fillText(t.name,a.x,a.y-76)}function frame(ts){let dt=Math.min(2,(ts-last)/16.67||1);last=ts;g.clearRect(0,0,900,560);let grad=g.createLinearGradient(0,0,0,560);grad.addColorStop(0,'#173c2d');grad.addColorStop(1,'#64703a');g.fillStyle=grad;g.fillRect(0,0,900,560);for(let i=0;i<70;i++){g.fillStyle=i%3?'#344f2b':'#59733a';g.beginPath();g.arc((i*137)%900,(i*83)%560,3+i%11,0,7);g.fill()}g.strokeStyle='#b5a365';g.lineWidth=7;g.strokeRect(32,35,836,485);if(player&&enemy){if(playing&&!paused){let p=types[player.id],e=types[enemy.id],mx=(+!!keys.right-+!!keys.left),my=(+!!keys.down-+!!keys.up);player.x+=mx*p.speed*dt;player.y+=my*p.speed*dt;if(mx)player.face=Math.sign(mx);let dx=player.x-enemy.x,dy=player.y-enemy.y,d=Math.hypot(dx,dy)||1;if(d>e.range*.78){enemy.x+=dx/d*e.speed*.65*dt;enemy.y+=dy/d*e.speed*.65*dt}enemy.face=dx>=0?1:-1;if(d<e.range*.95)attack(enemy,player,Math.random()<.006);if(keys.hit)attack(player,enemy);if(keys.special)attack(player,enemy,true);for(let a of [player,enemy]){a.x=Math.max(55,Math.min(845,a.x));a.y=Math.max(115,Math.min(480,a.y));a.cool=Math.max(0,a.cool-dt);a.special=Math.max(0,a.special-dt);a.flash=Math.max(0,a.flash-dt)}}drawUnit(player);drawUnit(enemy);g.fillStyle='#fff';g.font='17px system-ui';g.textAlign='left';g.fillText('Special: '+(player.special?Math.ceil(player.special/60)+'s':'KLAAR'),40,28);if(paused){g.font='bold 55px system-ui';g.textAlign='center';g.fillText('PAUZE',450,280)}}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;g.fillStyle=p.color;g.fillRect(p.x,p.y,5,5)}particles=particles.filter(p=>p.life>0);requestAnimationFrame(frame)}document.querySelector('#start').addEventListener('click',()=>{try{reset()}catch(e){document.querySelector('#status').textContent='Startfout: '+e.message;console.error(e)}});document.querySelector('#pause').onclick=()=>{if(player){paused=!paused;status.textContent=paused?'Gepauzeerd':'Gevecht hervat'}};for(let b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false}addEventListener('keydown',e=>{let k=({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',' ':'hit',Shift:'special'})[e.key];if(k){e.preventDefault();keys[k]=true}});addEventListener('keyup',e=>{let k=({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',' ':'hit',Shift:'special'})[e.key];if(k)keys[k]=false});try{requestAnimationFrame(frame)}catch(e){document.querySelector('#status').textContent='Animatiefout: '+e.message;console.error(e)}
</script></html>
