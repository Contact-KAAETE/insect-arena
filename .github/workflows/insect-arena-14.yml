name: INSECT ARENA 1.9A Landscape Scroll and Premium Fauna
on:
  push:
    branches:
      - main
      - feature/adventure-tutorial-centipede-14a
      - feature/biomes-creatures-15a
      - feature/living-terrains-16a
      - feature/immersive-fullscreen-17a
      - feature/seamless-pwa-updates-18a
      - feature/landscape-scroll-premium-fauna-19a
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tutorial, six biomes and thirteen predators
        run: node --test tests/arena-14.test.cjs tests/arena-15.test.cjs tests/arena-16.test.cjs tests/arena-17.test.cjs tests/arena-18.test.cjs tests/arena-19.test.cjs

      - name: Validate five SVG fauna assets
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          names = ["centipede-19.svg", "kruisspin-19.svg", "roofwants-19.svg", "libellenlarve-19.svg", "veenmol-19.svg"]
          for name in names:
              file = "assets/fighters/" + name
              ET.parse(file)
              print("Valid SVG:", file)
          PY
