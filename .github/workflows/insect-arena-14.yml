name: INSECT ARENA 1.6A living terrains checks
on:
  push:
    branches:
      - main
      - feature/adventure-tutorial-centipede-14a
      - feature/biomes-creatures-15a
      - feature/living-terrains-16a
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tutorial, six biomes and thirteen predators
        run: node --test tests/arena-14.test.cjs tests/arena-15.test.cjs tests/arena-16.test.cjs
